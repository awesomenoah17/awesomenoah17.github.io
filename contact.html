<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact AwesomeNoah17</title>

<style>

body {
    margin: 0;
    font-family: Roboto, Arial, sans-serif;
    background: #000000;
    color: white;
}


.actionbar {
    background: linear-gradient(
        to bottom,
        #064f7a 0%,
        #033653 100%
    );
    color: white;
    padding: 16px;
    font-size: 24px;
}


.content {
    padding: 16px;
}


.title {
    font-size: 20px;
    margin-bottom: 15px;
}


.divider {
    border-top: 1px solid #33c5f5;
    margin-top: 10px;
    margin-bottom: 20px;
}


label {
    color: white;
    font-size: 16px;
}


textarea {

    width: 100%;
    height: 120px;

    box-sizing: border-box;

    margin-top: 8px;
    margin-bottom: 18px;

    padding: 12px;

    background: #111111;

    border: 1px solid #33c5f5;

    color: white;

    font-size: 16px;

    resize: vertical;
}


.button-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 20px;

}


.button {

    width: 130px;

    padding: 10px;

    text-align: center;

    color: white;

    background: linear-gradient(
        to bottom,
        #eeeeee 0%,
        #555555 100%
    );

    border-radius: 3px;

    border: none;

    font-size: 16px;

    cursor: pointer;

    text-decoration: none;

}


.button:hover {

    background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #666666 100%
    );

}


</style>

</head>


<body>


<div class="actionbar">
    Contact Me
</div>



<div class="content">


<div class="title">
    Send Me A Message (Enter Your Email if you want a reply)
</div>


<div class="divider"></div>



<form action="https://formspree.io/f/xljrrwaq" method="POST">


<label>
    Message
</label>


<textarea 
    name="message"
    required
></textarea>



<div class="button-row">


    <button class="button" type="submit">
        Post
    </button>


    <a class="button" href="index.html">
        Back
    </a>


</div>



</form>


</div>


</body>
</html>
